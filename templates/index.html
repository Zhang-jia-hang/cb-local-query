<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地 Excel 可视化查询工具</title>
  <link rel="stylesheet" href="/static/css/tailwind.min.css" />
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <section class="card hero mb-4">
        <p class="kicker">LOCAL DATA WORKBENCH</p>
        <h1 class="text-2xl font-bold mb-2">勤博数据查询系统</h1>
        <p class="text-sm text-slate-600">Excel 导入 · 本地查询 · 一键导出</p>
      </section>

      <section class="card side-card">
        <div class="section-head mb-3">
          <h2 class="text-lg font-semibold">数据表</h2>
          <span class="badge">实时</span>
        </div>

        <div id="tableList" class="table-list mb-3">
          <p class="table-empty">暂无数据表</p>
        </div>

        <div class="import-box">
          <label class="label">导入 Excel 文件</label>
          <input id="excelFile" type="file" accept=".xlsx,.xls" class="input" />
          <button id="importBtn" class="btn btn-primary w-full">导入并建表</button>
          <p id="importMsg" class="text-sm mt-2 text-slate-600"></p>
        </div>
      </section>
    </aside>

    <main class="main-content">
      <section class="card query-card mb-4">
        <div class="section-head mb-3">
          <h2 class="text-lg font-semibold">查询条件</h2>
          <div class="chips">
            <span class="chip" id="currentTableTag">当前表：未选择</span>
            <span class="chip">字段组合</span>
          </div>
        </div>

        <div class="grid grid-cols-1 md-grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label">全局模糊查询</label>
            <input id="globalKeyword" class="input" placeholder="输入关键词" />
          </div>
          <div>
            <label class="label">每页条数</label>
            <select id="pageSize" class="input">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md-grid-cols-2 gap-3 mb-3">
          <div>
            <label class="label">单字段模糊查询 - 字段</label>
            <select id="singleField" class="input"></select>
          </div>
          <div>
            <label class="label">单字段模糊查询 - 关键词</label>
            <input id="singleKeyword" class="input" placeholder="例如：张三" />
          </div>
        </div>

        <div class="mb-3">
          <div class="flex items-center justify-between mb-2">
            <label class="label">多字段组合查询（AND）</label>
            <button id="addFilterBtn" class="btn btn-secondary">新增条件</button>
          </div>
          <div id="filters" class="space-y-2"></div>
        </div>

        <div class="flex flex-wrap gap-2">
          <button id="searchBtn" class="btn btn-primary">查询</button>
          <button id="resetBtn" class="btn">重置</button>
          <button id="exportBtn" class="btn btn-success">导出当前结果 Excel</button>
        </div>
        <p id="queryMsg" class="text-sm mt-2 text-slate-600"></p>
      </section>

      <section class="card result-card">
        <div class="section-head mb-3">
          <h2 class="text-lg font-semibold">查询结果</h2>
          <div class="flex items-center gap-2">
            <button id="prevBtn" class="btn">上一页</button>
            <span id="pageInfo" class="text-sm"></span>
            <button id="nextBtn" class="btn">下一页</button>
          </div>
        </div>

        <div class="table-wrap">
          <table id="resultTable" class="table"></table>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
