<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤博可视化数据查询工具</title>
  <link rel="stylesheet" href="/static/css/tailwind.min.css" />
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <div id="globalNotice" class="global-notice hidden" aria-live="polite"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <section class="card mb-3 table-manage-card">
        <div class="section-head mb-2">
          <h2 class="text-lg font-semibold title-with-icon"><span class="title-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="7" ry="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v5.5C5 13.43 8.13 15 12 15s7-1.57 7-3.5V6" stroke="currentColor" stroke-width="1.8"/><path d="M5 11.5V17c0 1.93 3.13 3.5 7 3.5s7-1.57 7-3.5v-5.5" stroke="currentColor" stroke-width="1.8"/></svg></span><span>数据表管理</span></h2>
          <span class="badge" id="tableCountBadge">0</span>
        </div>

        <div class="table-manage-toolbar mb-2">
          <button id="folderCreateToggleBtn" class="btn btn-secondary" type="button">新建文件夹</button>
          <p class="toolbar-hint">支持多级路径与当前文件夹下新建</p>
        </div>



        <div id="tableList" class="table-list mb-2">
          <p class="table-empty">暂无数据表</p>
        </div>
          <div class="import-box no-border-top">
          <div class="section-head mb-2">
            <label class="label m-0">数据操作</label>
            <span class="chip">多工作表自动建表</span>
          </div>
          <div class="import-actions import-actions-vertical">
            <button id="recycleToggleBtn" class="btn recycle-toggle" type="button">回收站</button>
            <button id="importBtn" class="btn btn-primary w-full" type="button">导入并建表</button>
          </div>
          <p id="importMsg" class="text-sm mt-2 text-slate-600"></p>
        </div>
      </section>
    </aside>

    <main class="main-content">
      <section class="card query-card mb-4">
        <div class="section-head mb-2">
          <h2 class="text-lg font-semibold">查询条件</h2>
          <div class="chips">
            <span class="chip" id="currentTableTag">当前表：未选择</span>
            <span class="chip" id="currentFolderTag">文件夹：-</span>
            <span class="chip" id="statTotalCols">总字段：0</span>
            <span class="chip" id="statHiddenCols">隐藏：0</span>
            <span class="chip" id="statQueryableCols">可查询：0</span>
          </div>
        </div>

        <div class="quick-row mb-3">
          <div class="quick-input">
            <label class="label">全局模糊查询</label>
            <input id="globalKeyword" class="input" placeholder="输入关键词后回车即可查询" />
          </div>
          <div class="quick-actions">
            <button id="searchBtn" class="btn btn-primary">查询</button>
            <button id="resetBtn" class="btn">重置</button>
            <button id="exportBtn" class="btn btn-success">导出当前结果 Excel</button>
          </div>
        </div>

        <div class="mb-3">
          <div class="section-head mb-2">
            <label class="label">多字段查询（支持模糊 / 范围 + AND / OR）</label>
            <button id="addFilterBtn" class="btn btn-secondary">新增条件</button>
          </div>
          <div id="filters" class="space-y-2"></div>
        </div>

        <details class="card-lite mb-2" id="advancedPanel">
          <summary>高级设置：多字段排序与隐藏列</summary>
          <div class="advanced-body">
            <div class="mb-3">
              <div class="section-head mb-2">
                <label class="label">排序规则（从上到下优先级）</label>
                <button id="addSortBtn" class="btn btn-secondary">新增排序</button>
              </div>
              <div id="sortRules" class="space-y-2"></div>
            </div>

            <label class="label">隐藏列管理（隐藏列不参与查询与导出）</label>
            <select id="hiddenColumns" class="input multi-select" multiple></select>
            <div class="flex gap-2 mt-2 flex-wrap">
              <button id="hideSelectedBtn" class="btn">隐藏选中字段</button>
              <button id="unhideSelectedBtn" class="btn">取消隐藏选中</button>
              <button id="clearHiddenBtn" class="btn">显示全部字段</button>
            </div>
            <p id="hiddenMsg" class="text-sm mt-2 text-slate-600"></p>
          </div>
        </details>

        <p id="queryMsg" class="text-sm mt-2 text-slate-600"></p>
      </section>

      <section class="card result-card">
        <div class="result-toolbar result-toolbar-top">
          <div class="result-toolbar-title">
            <h2 class="text-lg font-semibold">查询结果</h2>
            <span id="pageInfo" class="text-sm"></span>
          </div>
          <div class="result-pager-actions">
            <label class="label-inline">每页条数</label>
            <select id="pageSize" class="input page-size-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <button id="prevBtn" class="btn" type="button">上一页</button>
            <button id="nextBtn" class="btn" type="button">下一页</button>
          </div>
        </div>

        <div class="table-wrap result-table-wrap">
          <table id="resultTable" class="table"></table>
        </div>

        <div class="result-toolbar result-toolbar-bottom">
          <div id="pageInfoBottom" class="result-pager-summary text-sm"></div>
          <div class="result-pager-actions">
            <label class="label-inline">每页条数</label>
            <select id="pageSizeBottom" class="input page-size-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <button id="prevBtnBottom" class="btn" type="button">上一页</button>
            <button id="nextBtnBottom" class="btn" type="button">下一页</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="moveModal" class="modal hidden" aria-hidden="true">
    <div class="modal-mask" data-modal-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="moveModalTitle">
      <div class="section-head mb-2">
        <h3 id="moveModalTitle" class="text-lg font-semibold">移动数据表</h3>
        <button id="moveModalCloseBtn" class="btn btn-mini" type="button">关闭</button>
      </div>

      <div class="mb-2">
        <label class="label">选择目标文件夹</label>
        <select id="moveFolderSelect" class="input"></select>
      </div>

      <div class="mb-2">
        <label class="label">或新建并移动到该文件夹</label>
        <div class="folder-create">
          <input id="moveNewFolderInput" class="input" placeholder="例如：业务数据/华东区/2026" />
          <button id="moveCreateFolderBtn" class="btn btn-secondary" type="button">新建</button>
        </div>
      </div>

      <p id="moveModalMsg" class="text-sm mt-2 text-slate-600"></p>

      <div class="modal-actions">
        <button id="moveConfirmBtn" class="btn btn-primary" type="button">确认移动</button>
        <button id="moveCancelBtn" class="btn" type="button">取消</button>
      </div>
    </div>
  </div>

  <div id="recycleModal" class="modal hidden" aria-hidden="true">
    <div class="modal-mask" data-recycle-close="1"></div>
    <div class="modal-panel recycle-modal-panel" role="dialog" aria-modal="true" aria-labelledby="recycleModalTitle">
      <div class="section-head mb-2">
        <h3 id="recycleModalTitle" class="text-lg font-semibold">回收站</h3>
        <button id="recycleCloseBtn" class="btn btn-mini" type="button">关闭</button>
      </div>
      <div class="recycle-modal-toolbar mb-2">
        <div id="recycleSummary" class="recycle-summary">共 0 个已删除文件</div>
        <button id="recyclePurgeAllBtn" class="btn btn-danger btn-mini" type="button">全部删除</button>
      </div>
      <div id="recycleList" class="recycle-list recycle-list-modal">
        <p class="table-empty">回收站为空</p>
      </div>
    </div>
  </div>
  <div id="folderCreateModal" class="modal hidden" aria-hidden="true">
    <div class="modal-mask" data-folder-create-close="1"></div>
    <div class="modal-panel folder-create-modal-panel" role="dialog" aria-modal="true" aria-labelledby="folderCreateModalTitle">
      <div class="section-head mb-2">
        <h3 id="folderCreateModalTitle" class="text-lg font-semibold">新建文件夹</h3>
        <button id="folderCreateCloseBtn" class="btn btn-mini" type="button">关闭</button>
      </div>

      <div class="folder-create-form">
        <div>
          <label class="label">新建位置</label>
          <div id="folderCreateContext" class="folder-create-context">根目录</div>
        </div>

        <div>
          <label class="label">文件夹路径</label>
          <input id="newFolderPath" class="input" placeholder="例如：财务/2026/Q1 或 输入子目录名" />
          <p class="text-sm text-slate-600 mt-2">在指定文件夹下新建时，输入子目录名即可；也支持直接输入多级路径。</p>
        </div>
      </div>

      <p id="folderCreateMsg" class="text-sm mt-2 text-slate-600"></p>

      <div class="modal-actions">
        <button id="createFolderBtn" class="btn btn-primary" type="button">创建</button>
        <button id="folderCreateCancelBtn" class="btn" type="button">取消</button>
      </div>
    </div>
  </div>
  <div id="importModal" class="modal hidden" aria-hidden="true">
    <div class="modal-mask" data-import-close="1"></div>
    <div class="modal-panel import-modal-panel" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <div class="section-head mb-2">
        <h3 id="importModalTitle" class="text-lg font-semibold">导入并建表</h3>
        <button id="importCloseBtn" class="btn btn-mini" type="button">关闭</button>
      </div>

      <div class="import-form">
        <div>
          <label class="label">选择 Excel 文件</label>
          <div class="upload-shell upload-shell-large">
            <input id="excelFile" type="file" accept=".xlsx,.xls" class="input upload-input" />
          </div>
        </div>

        <div>
          <label class="label">导入到文件夹</label>
          <select id="importFolderSelect" class="input"></select>
          <p class="text-sm text-slate-600 mt-2">不选择则导入到根目录。</p>
        </div>
      </div>

      <p id="importModalMsg" class="text-sm mt-2 text-slate-600"></p>

      <div class="modal-actions">
        <button id="importConfirmBtn" class="btn btn-primary" type="button">确认导入</button>
        <button id="importCancelBtn" class="btn" type="button">取消</button>
      </div>
    </div>
  </div>
  <div id="importResultModal" class="modal hidden" aria-hidden="true">
    <div class="modal-mask" data-import-result-close="1"></div>
    <div class="modal-panel import-result-modal-panel" role="dialog" aria-modal="true" aria-labelledby="importResultModalTitle">
      <div class="section-head mb-2">
        <h3 id="importResultModalTitle" class="text-lg font-semibold">导入结果</h3>
        <button id="importResultCloseBtn" class="btn btn-mini" type="button">关闭</button>
      </div>
      <div id="importResultBody" class="import-result-body"></div>
      <div class="modal-actions">
        <button id="importResultConfirmBtn" class="btn btn-primary" type="button">我知道了</button>
      </div>
    </div>
  </div>
  <script src="/static/js/app.js"></script>

</body>
</html>
